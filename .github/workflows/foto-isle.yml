name: foto-isle
on:
  push:
    paths: ["foto-v2/*_liste.json", "foto-v2/tools/**", ".github/workflows/foto-isle.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: foto-isle
jobs:
  isle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "foto-v2", fetch-depth: 1 }
      - run: pip install pillow numpy scipy
      - run: ls foto-v2/*rembg*_liste.json >/dev/null 2>&1 && pip install 'rembg[cpu]' || true
      - name: Isle
        timeout-minutes: 100
        continue-on-error: true
        run: |
          for f in foto-v2/*_liste.json; do
            n=$(basename "$f" _liste.json)
            SAVE_SRC=$([ "$n" = test ] && echo 1) python foto-v2/tools/isle.py "$f" "foto-v2/$n" || true
          done
      - name: Kaydet
        if: always()
        run: |
          git config user.name "parcadiyari-bot"; git config user.email "bot@users.noreply.github.com"
          git add foto-v2
          git diff --cached --quiet || (git commit -m "foto-v2: islenmis gorseller" && for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && break; sleep 5; done)
